# SuperTokens Configuration for Production
# https://supertokens.com/docs/thirdpartyemailpassword/common-customizations/core/api-keys

core_config_version: 0
host: "0.0.0.0"
port: 3567

# MySQL connection - configured via environment variable
# The MYSQL_CONNECTION_URI environment variable will be used for database connection

# API Keys for security (configured via environment variable)
# api_keys: 

# Disable telemetry in production
disable_telemetry: true

# Access token validity (in seconds) - 1 hour
access_token_validity: 3600

# Refresh token validity (in seconds) - 60 days  
refresh_token_validity: 5184000

# Password reset token lifetime (in milliseconds) - 1 hour
password_reset_token_lifetime: 3600000

# Email verification token lifetime (in milliseconds) - 24 hours
email_verification_token_lifetime: 86400000

# Maximum server pool size
mysql_connection_pool_size: 10

# Logging
log_level: "INFO"
